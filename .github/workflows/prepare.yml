name: Prepare and Build

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the JSON config file"
        required: true
        type: string
      feature_set:
        description: "Feature Set"
        required: false
        type: string
      ksu_branch:
        description: "KernelSU branch or commit (empty = latest dev)"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS commit hash (empty = latest on auto-derived branch)"
        required: false
        type: string
        default: ""
      root_flavor:
        description: "Mutually exclusive root implementation (kernelsu, next, or resukisu)"
        required: false
        type: string
        default: ""
      root_commit:
        description: "Exact root implementation commit"
        required: false
        type: string
        default: ""
      nomount_commit:
        description: "Exact NoMount commit"
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        description: "Exact kernel_patches commit (resolved automatically)"
        required: false
        type: string
        default: ""
      anykernel3_commit:
        description: "Exact AnyKernel3 commit (resolved automatically)"
        required: false
        type: string
        default: ""
      droidspaces_commit:
        description: "Exact Droidspaces-OSS commit (resolved automatically)"
        required: false
        type: string
        default: ""
      brand_name:
        description: "Kernel branding text appended to the version string"
        required: false
        type: string
        default: Wild
      bypass:
        description: "Apply the kernel version-check bypass hack (disabled by default)"
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache"
        required: false
        type: boolean
        default: true
      os_patch_level:
        description: "Optional filter: patch date (YYYY-MM), kernel sublevel, lts (LTS branch), or all"
        required: false
        type: string
        default: ""
      kernel_release:
        description: "Exact kernel release to build (e.g. 6.12.81). Takes precedence over os_patch_level."
        required: false
        type: string
        default: ""
      variant:
        description: "Artifact variant label"
        required: false
        type: string
        default: ""

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Config and Build Final Matrix
        id: final
        shell: bash
        env:
          INPUT_OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          INPUT_KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          if [ ! -f "${{ inputs.config_file }}" ]; then
            echo "Error: Config file not found: ${{ inputs.config_file }}"
            exit 1
          fi

          CONFIG_JSON=$(cat "${{ inputs.config_file }}" | jq -c .)

          # Build { "include": [ {android_version:..., kernel_version:..., sublevel:..., os_patch_level:..., variant: ...}, ... ] }.
          # An explicit patch-level filter keeps manual validation dispatches bounded.
          FINAL=$(jq -cn \
            --argjson cfg "$CONFIG_JSON" \
            --arg requested_variant "${{ inputs.variant }}" '
            ($cfg.version | split("-")) as $version_parts
            | ($cfg.include) as $targets
            | {
              include: (
                [
                  $targets[] as $item
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: (if $requested_variant == "" then "Normal" else $requested_variant end)
                    }
                ]
                + (if $requested_variant == "" then [
                    $targets[] as $item
                    | select($item.variant != null)
                    | {
                        version: $cfg.version,
                        android_version: $version_parts[0],
                        kernel_version: $version_parts[1],
                        sublevel: $item.sublevel,
                        os_patch_level: $item.date,
                        variant: $item.variant
                      }
                  ] else [] end)
                | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])
              )
            }')

          # Every target carries expected_sublevel: non-empty only when the exact
          # release was requested but has to be built off the rolling LTS branch,
          # where the sublevel is not known until the Makefile is read.
          FINAL=$(jq -c '{include: [.include[] | .expected_sublevel = ""]}' <<< "$FINAL")

          KERNEL_RELEASE="$(printf '%s' "$INPUT_KERNEL_RELEASE" | tr -d '[:space:]')"
          SELECTED_PATCH_LEVEL="$(printf '%s' "$INPUT_OS_PATCH_LEVEL" | tr '[:upper:]' '[:lower:]')"
          if [ "$SELECTED_PATCH_LEVEL" = "all" ]; then
            SELECTED_PATCH_LEVEL=""
          fi

          if [ -n "$KERNEL_RELEASE" ]; then
            # Exact release (e.g. 6.12.81) wins over the patch-level filter.
            if ! [[ "$KERNEL_RELEASE" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
              echo "Error: kernel_release must look like 6.12.81 (got '${KERNEL_RELEASE}')." >&2
              exit 1
            fi
            REQUESTED_KERNEL="${BASH_REMATCH[1]}"
            REQUESTED_SUBLEVEL="${BASH_REMATCH[2]}"
            CONFIG_KERNEL="$(jq -r '.version | split("-")[1]' <<< "$CONFIG_JSON")"
            if [ "$REQUESTED_KERNEL" != "$CONFIG_KERNEL" ]; then
              echo "Error: ${KERNEL_RELEASE} is not on the ${CONFIG_KERNEL} line (${{ inputs.config_file }})." >&2
              exit 1
            fi
            if [ -n "$SELECTED_PATCH_LEVEL" ]; then
              echo "Note: kernel_release=${KERNEL_RELEASE} overrides os_patch_level=${SELECTED_PATCH_LEVEL}."
            fi

            MATCHED=$(jq -c --arg sublevel "$REQUESTED_SUBLEVEL" '
              {include: [.include[] | select(.sublevel == $sublevel)]}
            ' <<< "$FINAL")
            if [ "$(jq '.include | length' <<< "$MATCHED")" -gt 0 ]; then
              echo "Building ${KERNEL_RELEASE} from its pinned patch-level branch(es)."
              FINAL="$MATCHED"
            else
              # Not a pinned sublevel: build it off the rolling LTS branch and
              # fail early in the build if that branch is not at this release.
              MATCHED=$(jq -c --arg sublevel "$REQUESTED_SUBLEVEL" '
                {include: [.include[] | select(.os_patch_level == "lts") | .expected_sublevel = $sublevel]}
              ' <<< "$FINAL")
              if [ "$(jq '.include | length' <<< "$MATCHED")" -eq 0 ]; then
                echo "Error: ${KERNEL_RELEASE} is not a pinned release and ${CONFIG_KERNEL} has no LTS target." >&2
                echo "Available releases:" >&2
                jq -r --arg kv "$CONFIG_KERNEL" \
                  '.include[] | select(.sublevel != "X") | "  \($kv).\(.sublevel) (\(.os_patch_level))"' \
                  <<< "$FINAL" | sort -u >&2
                exit 1
              fi
              echo "${KERNEL_RELEASE} is not a pinned release; building from the LTS branch and verifying SUBLEVEL == ${REQUESTED_SUBLEVEL}."
              FINAL="$MATCHED"
            fi
          elif [ -n "$SELECTED_PATCH_LEVEL" ]; then
            FULL_FINAL="$FINAL"
            FINAL=$(jq -c --arg patch_level "$SELECTED_PATCH_LEVEL" '
              {include: [.include[] | select(.os_patch_level == $patch_level)]}
            ' <<< "$FINAL")
            # No date matched -- try interpreting the value as a kernel sublevel
            if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
              FINAL=$(jq -c --arg sublevel "$SELECTED_PATCH_LEVEL" '
                {include: [.include[] | select(.sublevel == $sublevel)]}
              ' <<< "$FULL_FINAL")
            fi
          fi
          if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
            echo "Error: no build targets match patch level '${SELECTED_PATCH_LEVEL}'." >&2
            exit 1
          fi

          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sublevel: ${{ matrix.sublevel }}
      expected_sublevel: ${{ matrix.expected_sublevel }}
      os_patch_level: ${{ matrix.os_patch_level }}
      variant: ${{ matrix.variant }}
      feature_set: ${{ inputs.feature_set }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_commit: ${{ inputs.susfs_commit }}
      root_flavor: ${{ inputs.root_flavor }}
      root_commit: ${{ inputs.root_commit }}
      nomount_commit: ${{ inputs.nomount_commit }}
      kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
      anykernel3_commit: ${{ inputs.anykernel3_commit }}
      droidspaces_commit: ${{ inputs.droidspaces_commit }}
      brand_name: ${{ inputs.brand_name }}
      bypass: ${{ inputs.bypass }}
      use_cache: ${{ inputs.use_cache }}
    secrets: inherit
